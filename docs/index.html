<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>slot-heatmap（レイトギャップ平和島）</title>
  <link rel="stylesheet" href="assets/style.css" />
  <!-- Plotly（CDN） -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <h1>slot-heatmap</h1>
      <p class="muted">収集データから「ヒートマップ / ランキング / 簡易予測（移動平均）」を表示</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="row">
        <div class="col">
          <label class="label" for="dateSelect">表示日</label>
          <select id="dateSelect"></select>
        </div>

        <div class="col">
          <label class="label" for="daysSelect">ヒートマップ日数</label>
          <select id="daysSelect">
            <option value="14">14日</option>
            <option value="30" selected>30日</option>
            <option value="60">60日</option>
          </select>
        </div>

        <div class="col">
          <label class="label" for="unitSearch">台番号検索（部分一致）</label>
          <input id="unitSearch" type="text" inputmode="numeric" placeholder="例：0729 / 729 / 07" />
          <div class="muted small">※ 入力すると、ヒートマップ・ランキング・予測がその台番号だけに絞られます</div>
        </div>
      </div>

      <div class="meta">
        <span id="updatedAt" class="muted"></span>
        <span id="filterStatus" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>ヒートマップ（最大持玉）</h2>
      <div id="heatmap" class="plot"></div>
      <p class="muted small">
        セルをクリックすると、その日のランキングに切り替わります。
      </p>
    </section>

    <section class="card">
      <h2>ランキング（最大持玉）</h2>
      <div class="tableWrap">
        <table id="rankingTable">
          <thead>
            <tr>
              <th>#</th>
              <th>台番号</th>
              <th>機種</th>
              <th>最大持玉</th>
              <th>BB</th>
              <th>RB</th>
              <th>累計スタート</th>
              <th>差枚</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>簡易予測（次回：移動平均）</h2>
      <p class="muted small">
        ※「勝てる保証」ではありません。過去データの平均から機械的に出しているだけの簡易版です。
      </p>
      <div class="tableWrap">
        <table id="predictTable">
          <thead>
            <tr>
              <th>#</th>
              <th>台番号</th>
              <th>予測 最大持玉</th>
              <th>参照日数</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <footer class="footer muted">
      <div>Generated by collector/build_site.py</div>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
