<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>イベント記入（取材・特日メモ）</title>
  <style>
    :root { --b:#e5e7eb; --t:#111827; --m:#6b7280; --bg:#ffffff; --p:#2563eb; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; color:var(--t); background:#f9fafb; }
    header { background:var(--bg); border-bottom:1px solid var(--b); position:sticky; top:0; z-index:10; }
    header .wrap { max-width: 980px; margin:0 auto; padding:14px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
    h1 { font-size:16px; margin:0; }
    .wrap { max-width: 980px; margin:0 auto; padding:16px; }
    .card { background:var(--bg); border:1px solid var(--b); border-radius:12px; padding:14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .grid-1 { display:grid; grid-template-columns: 1fr; gap:10px; }
    label { font-size:12px; color:var(--m); display:block; margin-bottom:6px; }
    input, select, textarea { width:100%; box-sizing:border-box; padding:10px 10px; border:1px solid var(--b); border-radius:10px; font-size:14px; background:white; }
    textarea { min-height: 86px; resize: vertical; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button { border:1px solid var(--b); background:white; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px; }
    button.primary { background:var(--p); border-color:var(--p); color:white; }
    button.danger { background:#ef4444; border-color:#ef4444; color:white; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .muted { color:var(--m); font-size:12px; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding:10px 8px; border-bottom:1px solid var(--b); text-align:left; vertical-align:top; font-size:14px; }
    th { color:var(--m); font-size:12px; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid var(--b); border-radius:999px; font-size:12px; color:var(--m); background:#fff; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .two { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media (min-width: 860px) { .two { grid-template-columns: 380px 1fr; } }
    a { color: var(--p); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; background: #111827; color: white; padding: 10px 12px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events:none; transition: opacity .2s; }
    .toast.show { opacity: 0.92; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>イベント記入（取材・特日メモ）</h1>
      <div class="top-actions">
        <a href="./index.html">← ヒートマップへ</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="two">
      <section class="card">
        <h2 style="margin:0 0 10px;font-size:14px;">新規/編集</h2>

        <form id="eventForm" class="grid-1">
          <input type="hidden" id="eventId" value="" />

          <div class="grid">
            <div>
              <label>日付</label>
              <input id="date" type="date" required />
            </div>
            <div>
              <label>種別</label>
              <select id="type">
                <option value="取材">取材</option>
                <option value="特日">特日</option>
                <option value="新台入替">新台入替</option>
                <option value="イベント">イベント</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <div>
            <label>タイトル</label>
            <input id="title" type="text" placeholder="例：○○取材 / ジャグラー強め など" required />
          </div>

          <div>
            <label>メモ（任意）</label>
            <textarea id="memo" placeholder="例：狙い機種・末尾法則・抽選人数・並びなど"></textarea>
          </div>

          <div class="row">
            <button class="primary" id="saveBtn" type="submit">保存</button>
            <button id="resetBtn" type="button">クリア</button>
            <span class="muted">※保存先はブラウザ内（この端末）です</span>
          </div>
        </form>

        <hr style="border:none;border-top:1px solid var(--b); margin:14px 0;">

        <div class="row" style="justify-content:space-between;">
          <div>
            <div style="font-size:14px; font-weight:600;">データ移行</div>
            <div class="muted">エクスポートして、別端末でインポートできます</div>
          </div>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="exportBtn" type="button">エクスポート(JSON)</button>
          <label style="margin:0;">
            <input id="importFile" type="file" accept="application/json" style="display:none;">
            <button id="importBtn" type="button">インポート(JSON)</button>
          </label>
          <button id="wipeBtn" type="button" class="danger">全削除</button>
        </div>

        <p class="muted" style="margin-top:10px;">
          端末間で同期したい場合は、エクスポートしたJSONを <code>data/events.json</code> としてGitHubに置く方式もできます（必要なら次の手順も案内します）。
        </p>
      </section>

      <section class="card">
        <div class="row" style="justify-content:space-between;">
          <div>
            <h2 style="margin:0;font-size:14px;">登録済みイベント</h2>
            <div class="muted"><span id="countLabel">0件</span> / クリックで編集</div>
          </div>

          <div class="row">
            <div>
              <label>月で絞り込み</label>
              <input id="monthFilter" type="month" />
            </div>
            <div>
              <label>キーワード</label>
              <input id="q" type="text" placeholder="取材名/メモ検索" />
            </div>
          </div>
        </div>

        <div style="overflow:auto; margin-top:10px;">
          <table>
            <thead>
              <tr>
                <th style="min-width:110px;">日付</th>
                <th style="min-width:90px;">種別</th>
                <th style="min-width:200px;">タイトル</th>
                <th style="min-width:240px;">メモ</th>
                <th style="min-width:160px;">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./events.js"></script>
</body>
</html>
